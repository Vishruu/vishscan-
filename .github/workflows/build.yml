name: Build VishScan APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

     - name: Install Android SDK and accept licenses
  run: |
    export ANDROID_SDK_ROOT=~/.buildozer/android/sdk
    mkdir -p "$ANDROID_SDK_ROOT"
    cd "$ANDROID_SDK_ROOT"
    wget -q https://dl.google.com/android/repository/commandlinetools-linux-11217075_latest.zip -O cmdline_tools.zip
    unzip -q cmdline_tools.zip
    mkdir -p cmdline-tools
    mv tools cmdline-tools/latest
    export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    # Accept all licenses automatically
    yes | sdkmanager --licenses
    # Install required SDK packages
    sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Pre-download freetype
        run: |
          mkdir -p ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages
          cd ~/.buildozer/android/platform/build-arm64-v8a/packages
          mkdir -p freetype
          cd freetype
          wget -q https://github.com/freetype/freetype/releases/download/ver-2-14-1/freetype-2.14.1.tar.gz
          touch .mark-freetype-2.14.1.tar.gz

      - name: Install Python dependencies
        run: |
          pip install --user --upgrade pip buildozer cython

      - name: Build APK
        run: |
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_HOME/tools/bin:$PATH
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VishScan-APK
          path: ./bin/*.apk
