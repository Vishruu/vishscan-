name: Build VishScan APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.home }}/.buildozer/android/sdk
      ANDROID_HOME: ${{ runner.home }}/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/python
          key: ${{ runner.os }}-pip-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache buildozer & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ runner.home }}/.buildozer/android/sdk
          key: ${{ runner.os }}-buildozer-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      # --- REPLACED STEP START ---
      - name: Install Android SDK and accept licenses
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11217075_latest.zip -O cmdline_tools.zip
          unzip -q cmdline_tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest 2>/dev/null || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;25.1.8937393"
      # --- REPLACED STEP END ---

      - name: Pre-download freetype
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          cd "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          wget -q https://github.com/freetype/freetype/releases/download/ver-2-14-1/freetype-2.14.1.tar.gz -O freetype-2.14.1.tar.gz || true
          touch .mark-freetype-2.14.1.tar.gz

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user --upgrade pip buildozer cython

      # --- REPLACED BUILD STEP START ---
      - name: Build APK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$HOME/.local/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          buildozer android debug
      # --- REPLACED BUILD STEP END ---

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VishScan-APK
          path: ./bin/*.apk
