name: Build VishScan APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Android SDK & Legacy Symlink
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            cd $ANDROID_HOME/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
          fi
          
          # Create a symlink for python-for-android which expects tools/bin/sdkmanager
          cd $ANDROID_HOME
          if [ ! -e "tools" ]; then
            ln -s cmdline-tools/latest tools
          fi

          export PATH=$ANDROID_HOME/tools/bin:$PATH
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Install Python dependencies
        run: |
          pip install --user --upgrade pip buildozer cython

      - name: Build APK (with robust retry logic)
        run: |
          export PATH=$ANDROID_HOME/tools/bin:$PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          # Unset preinstalled runner variables that conflict with python-for-android
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME

          # Retry up to 5 times for gateway timeouts/network drops
          for i in 1 2 3 4 5; do
            echo "Attempt $i of 5..."
            if buildozer android debug; then
              echo "Build succeeded!"
              exit 0
            fi
            echo "Attempt $i failed due to network/timeout error. Waiting 15 seconds..."
            sleep 15
          done
          echo "All build attempts failed."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VishScan-APK
          path: ./bin/*.apk
