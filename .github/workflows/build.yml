name: Build VishScan APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Android SDK & Legacy Symlink
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            cd $ANDROID_HOME/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
          fi
          
          cd $ANDROID_HOME
          if [ ! -e "tools" ]; then
            ln -s cmdline-tools/latest tools
          fi

          export PATH=$ANDROID_HOME/tools/bin:$PATH
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Install Python dependencies
        run: |
          pip install --user --upgrade pip buildozer cython

      - name: Pre-download Freetype to Cache (Bypass Savannah Server Issues)
        run: |
          mkdir -p ~/.buildozer/cache
          # Download freetype-2.14.1 directly from a reliable mirror source into the cache directory
          wget -O ~/.buildozer/cache/freetype-2.14.1.tar.gz https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz || \
          wget -O ~/.buildozer/cache/freetype-2.14.1.tar.gz https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz || true
          
          # If both fail due to network drops, grab it from an alternative archival mirror
          if [ ! -f ~/.buildozer/cache/freetype-2.14.1.tar.gz ]; then
            curl -L -o ~/.buildozer/cache/freetype-2.14.1.tar.gz https://www.freedesktop.org/software/fontconfig/digro/freetype-2.14.1.tar.gz
          fi

      - name: Build APK
        run: |
          export PATH=$ANDROID_HOME/tools/bin:$PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VishScan-APK
          path: ./bin/*.apk
