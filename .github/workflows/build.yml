name: Build VishScan APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/python
          key: ${{ runner.os }}-pip-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache buildozer & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Android SDK and accept licenses
        run: |
          cd ~
          mkdir -p .buildozer/android/platform/android-sdk
          cd .buildozer/android/platform/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11217075_latest.zip
          unzip -q commandlinetools-linux-11217075_latest.zip
          mkdir -p tools
          cp -r cmdline-tools/* tools/
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_HOME/tools/bin:$PATH
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME
          $ANDROID_HOME/tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Pre-download freetype
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          cd "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          wget -q https://github.com/freetype/freetype/releases/download/ver-2-14-1/freetype-2.14.1.tar.gz -O freetype-2.14.1.tar.gz || true
          touch .mark-freetype-2.14.1.tar.gz

      - name: Install Python dependencies
        run: |
          pip install --user --upgrade pip buildozer cython

      - name: Build APK
        run: |
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_HOME/tools/bin:$PATH
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VishScan-APK
          path: ./bin/*.apk
