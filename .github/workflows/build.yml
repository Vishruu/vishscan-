name: Build VishScan APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Android build-tools
        run: |
          SDK_HOME=/home/user/.buildozer/android/platform/android-sdk
          if [ -d "$SDK_HOME/tools/bin" ]; then
            SDK_MANAGER="$SDK_HOME/tools/bin/sdkmanager"
          elif [ -d "$SDK_HOME/cmdline-tools/latest/bin" ]; then
            SDK_MANAGER="$SDK_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "sdkmanager not found"
            exit 1
          fi
          echo "Using sdkmanager at: $SDK_MANAGER"
          yes | $SDK_MANAGER "build-tools;30.0.3"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VishScan-APK
          path: ./bin/*.apk
