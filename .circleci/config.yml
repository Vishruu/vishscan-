version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.04-ndk
    resource_class: large
    steps:
      - checkout
      
      - run:
          name: Install System Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y python3-pip python3-dev git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lldb
            sudo pip3 install --upgrade pip buildozer cython

      - restore_cache:
          key: buildozer-android-sdk-v1

      - run:
          name: Run Buildozer
          command: |
            buildozer -v android debug

      - save_cache:
          key: buildozer-android-sdk-v1
          paths:
            - ~/.buildozer

      - store_artifacts:
          path: bin/
          destination: apks

workflows:
  version: 2
  build_workflow:
    jobs:
      - build
