version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.10
    resource_class: large
    environment:
      ANDROID_HOME: /home/circleci/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/circleci/.buildozer/android/platform/android-sdk
    steps:
      - checkout

      - restore_cache:
          keys:
            - v23-buildozer-cache-{{ checksum "buildozer.spec" }}
            - v23-buildozer-cache-

      - run:
          name: Install System Dependencies
          command: |
            sudo apt update
            sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - run:
          name: Install Android SDK & Build Tools
          command: |
            mkdir -p $ANDROID_HOME/cmdline-tools
            if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              cd $ANDROID_HOME/cmdline-tools
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q commandlinetools-linux-11076708_latest.zip
              mv cmdline-tools latest
            fi
            
            cd $ANDROID_HOME
            if [ ! -e "tools" ]; then
              ln -s cmdline-tools/latest tools
            fi

            export PATH=$ANDROID_HOME/tools/bin:$PATH
            
            mkdir -p $ANDROID_HOME/licenses
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
            
            yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
            sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - run:
          name: Install Python Dependencies & Force Stable p4a
          command: |
            pip install --user --upgrade pip buildozer cython
            pip install --user python-for-android==2024.01.21

      - run:
          name: Override p4a Download Function Completely to Avoid Python.org Bad Gateway Errors
          command: |
            python3 -c '
            import site, os
            for site_dir in site.getsitepackages() + [site.getusersitepackages()]:
                util_path = os.path.join(site_dir, "pythonforandroid", "util.py")
                if os.path.exists(util_path):
                    with open(util_path, "r") as f:
                        content = f.read()
                    target_def = "def download("
                    if target_def in content:
                        parts = content.split(target_def)
                        new_download_func = """def download(url, dest=None):
    import os, urllib.request, shutil
    filename = os.path.basename(url)
    cache_dir = os.path.expanduser("~/.buildozer/downloads")
    os.makedirs(cache_dir, exist_ok=True)
    local_file = os.path.join(cache_dir, filename)
    if os.path.exists(local_file) and os.path.getsize(local_file) > 0:
        print(f"[OFFLINE CACHE HIT] Using cached file for {filename}")
        if dest is not None:
            shutil.copy(local_file, dest)
            return dest
        return local_file
    mirrors = [
        url,
        f"https://github.com/hrydgard/ppsspp-deps/raw/master/other/{filename}",
        f"https://files.pythonhosted.org/packages/source/{filename[0]}/{filename.split("-")[0]}/{filename}"
    ]
    for m in mirrors:
        try:
            print(f"Downloading {filename} from {m}...")
            urllib.request.urlretrieve(m, local_file)
            if os.path.exists(local_file) and os.path.getsize(local_file) > 0:
                break
        except Exception as e:
            print(f"Failed to download from {m}: {e}")
    if not os.path.exists(local_file) or os.path.getsize(local_file) == 0:
        print(f"Warning: Could not download {filename}. Creating empty placeholder.")
        open(local_file, "wb").close()
    if dest is not None:
        shutil.copy(local_file, dest)
        return dest
    return local_file
"""
                        rest = parts[1]
                        next_func_idx = rest.find("\ndef ")
                        remaining_code = rest[next_func_idx:] if next_func_idx != -1 else ""
                        new_content = parts[0] + target_def + new_download_func + remaining_code
                        with open(util_path, "w") as f:
                            f.write(new_content)
                        print("Successfully monkeypatched pythonforandroid/util.py download function!")
            '

      - run:
          name: Seed Download Cache with Local Archives
          command: |
            mkdir -p ~/.buildozer/downloads
            curl -L -o ~/.buildozer/downloads/Python-3.10.10.tgz "https://www.python.org/ftp/python/3.10.10/Python-3.10.10.tgz" || true
            curl -L -o ~/.buildozer/downloads/setuptools-67.5.1.tar.gz "https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-67.5.1.tar.gz" || true
            curl -L -o ~/.buildozer/downloads/openssl-1.1.1u.tar.gz "https://www.openssl.org/source/openssl-1.1.1u.tar.gz" || true
            curl -L -o ~/.buildozer/downloads/sqlite-autoconf-3410200.tar.gz "https://www.sqlite.org/2023/sqlite-autoconf-3410200.tar.gz" || true
            curl -L -o ~/.buildozer/downloads/SDL2-2.26.5.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-2.26.5/SDL2-2.26.5.tar.gz" || true
            curl -L -o ~/.buildozer/downloads/SDL2_image-2.6.2.tar.gz "https://github.com/libsdl-org/SDL_image/releases/download/release-2.6.2/SDL2_image-2.6.2.tar.gz" || true
            curl -L -o ~/.buildozer/downloads/SDL2_ttf-2.20.1.tar.gz "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.20.1/SDL2_ttf-2.20.1.tar.gz" || true
            curl -L -o ~/.buildozer/downloads/SDL2_mixer-2.6.2.tar.gz "https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.6.2/SDL2_mixer-2.6.2.tar.gz" || true
            curl -L -o ~/.buildozer/downloads/freetype-2.13.0.tar.gz "https://sourceforge.net/projects/freetype/files/freetype2/2.13.0/freetype-2.13.0.tar.gz" || true
            curl -L -o ~/.buildozer/downloads/libffi-3.4.4.tar.gz "https://github.com/libffi/libffi/releases/download/v3.4.4/libffi-3.4.4.tar.gz" || true

      - run:
          name: Build APK
          command: |
            export PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH
            
            if [ -d "$ANDROID_HOME/build-tools/33.0.2" ]; then
              export PATH=$ANDROID_HOME/build-tools/33.0.2:$PATH
              echo "Exported build-tools 33.0.2 to PATH"
            fi

            export PATH="$HOME/.local/bin:$PATH"
            
            rm -rf .buildozer/
            
            python3 -c "
            import configparser
            config = configparser.ConfigParser()
            config.optionxform = str
            config.read('buildozer.spec')
            if 'app' in config:
                config['app']['android.archs'] = 'arm64-v8a'
            with open('buildozer.spec', 'w') as configfile:
                config.write(configfile)
            "

            unset ANDROID_NDK
            unset ANDROID_NDK_HOME

            buildozer -v android debug

      - save_cache:
            key: v23-buildozer-cache-{{ checksum "buildozer.spec" }}
            paths:
              - ~/.buildozer

      - store_artifacts:
            path: bin/
            destination: apks

workflows:
  version: 2
  build_workflow:
    jobs:
      - build
