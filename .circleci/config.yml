version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.10
    resource_class: large
    environment:
      ANDROID_HOME: /home/circleci/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/circleci/.buildozer/android/platform/android-sdk
    steps:
      - checkout

      - restore_cache:
          keys:
            - v4-buildozer-cache-{{ checksum "buildozer.spec" }}
            - v4-buildozer-cache-

      - run:
          name: Install System Dependencies
          command: |
            sudo apt update
            sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - run:
          name: Install Android SDK & Build Tools
          command: |
            mkdir -p $ANDROID_HOME/cmdline-tools
            if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              cd $ANDROID_HOME/cmdline-tools
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q commandlinetools-linux-11076708_latest.zip
              mv cmdline-tools latest
            fi
            
            cd $ANDROID_HOME
            if [ ! -e "tools" ]; then
              ln -s cmdline-tools/latest tools
            fi

            export PATH=$ANDROID_HOME/tools/bin:$PATH
            
            mkdir -p $ANDROID_HOME/licenses
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
            
            yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
            sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - run:
          name: Install Python Dependencies
          command: |
            pip install --user --upgrade pip buildozer cython python-for-android

      - run:
          name: Pre-emptively Patch Freetype Recipe
          command: |
            python3 -c '
            import pythonforandroid, os
            p4a_dir = os.path.dirname(pythonforandroid.__file__)
            recipe_dir = os.path.join(p4a_dir, "recipes", "freetype")
            os.makedirs(recipe_dir, exist_ok=True)
            content = """from pythonforandroid.recipe import Recipe\n\nclass FreetypeRecipe(Recipe):\n    version = '\''2.13.0'\''\n    url = '\''https://sourceforge.net/projects/freetype/files/freetype2/{version}/freetype-{version}.tar.gz'\''\n    patches = []\n\nrecipe = FreetypeRecipe()\n"""
            with open(os.path.join(recipe_dir, "__init__.py"), "w") as f:
                f.write(content)
            print("Successfully patched Freetype recipe to use SourceForge.")
            '

      - run:
          name: Build APK
          command: |
            export PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH
            
            if [ -d "$ANDROID_HOME/build-tools/33.0.2" ]; then
              export PATH=$ANDROID_HOME/build-tools/33.0.2:$PATH
              echo "Exported build-tools 33.0.2 to PATH"
            fi

            export PATH="$HOME/.local/bin:$PATH"
            
            # Force single architecture
            sed -i 's/^#* *android.archs.*/android.archs = arm64-v8a/g' buildozer.spec

            # Unset conflicting NDK env vars
            unset ANDROID_NDK
            unset ANDROID_NDK_HOME

            buildozer android debug

      - save_cache:
          key: v4-buildozer-cache-{{ checksum "buildozer.spec" }}
          paths:
            - ~/.buildozer

      - store_artifacts:
            path: bin/
            destination: apks

workflows:
  version: 2
  build_workflow:
    jobs:
      - build
