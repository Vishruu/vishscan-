version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.10
    resource_class: large
    environment:
      ANDROID_HOME: /home/circleci/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/circleci/.buildozer/android/platform/android-sdk
    steps:
      - checkout

      - restore_cache:
          keys:
            - v4-buildozer-cache-{{ checksum "buildozer.spec" }}
            - v4-buildozer-cache-

      - run:
          name: Install System Dependencies
          command: |
            sudo apt update
            sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - run:
          name: Install Android SDK & Build Tools
          command: |
            mkdir -p $ANDROID_HOME/cmdline-tools
            if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              cd $ANDROID_HOME/cmdline-tools
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q commandlinetools-linux-11076708_latest.zip
              mv cmdline-tools latest
            fi
            
            cd $ANDROID_HOME
            if [ ! -e "tools" ]; then
              ln -s cmdline-tools/latest tools
            fi

            export PATH=$ANDROID_HOME/tools/bin:$PATH
            
            mkdir -p $ANDROID_HOME/licenses
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
            
            yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
            sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - run:
          name: Install Python Dependencies
          command: |
            pip install --user --upgrade pip buildozer cython

      - run:
          name: Build APK
          command: |
            export PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH
            
            if [ -d "$ANDROID_HOME/build-tools/33.0.2" ]; then
              export PATH=$ANDROID_HOME/build-tools/33.0.2:$PATH
              echo "Exported build-tools 33.0.2 to PATH"
            fi

            export PATH="$HOME/.local/bin:$PATH"
            
            # Force single architecture
            sed -i 's/^#* *android.archs.*/android.archs = arm64-v8a/g' buildozer.spec

            # Unset conflicting NDK env vars
            unset ANDROID_NDK
            unset ANDROID_NDK_HOME

            # Run a quick buildozer command just to unpack python-for-android recipes, then patch them live if they appear
            buildozer android update || true

            # Patch Freetype recipe URL dynamically wherever it's unpacked
            find ~/.buildozer -name "__init__.py" | grep "freetype" | while read file; do
              sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://sourceforge.net/projects/freetype/files/freetype2/|g' "$file"
              echo "Patched freetype URL in $file"
            done

            # Now run the actual build
            buildozer android debug

      - save_cache:
          key: v4-buildozer-cache-{{ checksum "buildozer.spec" }}
          paths:
            - ~/.buildozer

      - store_artifacts:
            path: bin/
            destination: apks

workflows:
  version: 2
  build_workflow:
    jobs:
      - build
