version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.10
    resource_class: large
    environment:
      ANDROID_HOME: /home/circleci/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/circleci/.buildozer/android/platform/android-sdk
    steps:
      - checkout

      - restore_cache:
          keys:
            - v5-buildozer-cache-{{ checksum "buildozer.spec" }}
            - v5-buildozer-cache-

      - run:
          name: Install System Dependencies
          command: |
            sudo apt update
            sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - run:
          name: Install Android SDK & Build Tools
          command: |
            mkdir -p $ANDROID_HOME/cmdline-tools
            if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              cd $ANDROID_HOME/cmdline-tools
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q commandlinetools-linux-11076708_latest.zip
              mv cmdline-tools latest
            fi

            export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

            # Pre-accept all standard Android SDK licenses to avoid interactive prompts
            mkdir -p $ANDROID_HOME/licenses
            printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
            printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > $ANDROID_HOME/licenses/android-sdk-preview-license
            printf "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license
            printf "859f317696f67ef3d7f30a50a5560e7834b43903" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license
            printf "d975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/intel-android-extra-license
            printf "e9acab5b5fbb560a72cfaecce8946896ff6aab9d" > $ANDROID_HOME/licenses/mips-android-sysimage-license

            # Accept any remaining licenses; || true prevents SIGPIPE (exit 141) from failing the step
            yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME 2>/dev/null || true
            sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"

            # Create tools/bin/sdkmanager symlink for buildozer/p4a compatibility.
            # p4a checks tools/bin/sdkmanager (old layout), not cmdline-tools/latest/bin/sdkmanager.
            mkdir -p $ANDROID_HOME/tools/bin
            ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager

      - run:
          name: Install Python Dependencies
          command: |
            pip install --user --upgrade pip buildozer cython

      - run:
          name: Build APK
          command: |
            export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | head -n 1)
            if [ -n "$BUILD_TOOLS_DIR" ]; then
              export PATH=$BUILD_TOOLS_DIR:$PATH
              echo "Added $BUILD_TOOLS_DIR to PATH"
            fi

            export PATH="$HOME/.local/bin:$PATH"

            unset ANDROID_NDK
            unset ANDROID_NDK_HOME

            buildozer android debug

      - save_cache:
          key: v5-buildozer-cache-{{ checksum "buildozer.spec" }}
          paths:
            - ~/.buildozer

      - store_artifacts:
            path: bin/
            destination: apks

workflows:
  version: 2
  build_workflow:
    jobs:
      - build
